[package]
name = "aethelgard-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Inspectable execution core and API for auditable agent systems"
license = "Apache-2.0"
repository = "https://github.com/kalkinfts/Aethelgard-Mesh"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
